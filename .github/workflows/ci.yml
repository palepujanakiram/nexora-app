name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets the qlty coverage upload authenticate with OIDC

jobs:
  flutter:
    name: Flutter tests and coverage (min 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - name: Tests with 95% line coverage gate
        run: dart run tool/coverage.dart --min 95

      - name: Upload coverage to qlty
        if: always() && hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  worker:
    name: Cloudflare Worker tests and coverage (min 95%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy/cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run coverage
